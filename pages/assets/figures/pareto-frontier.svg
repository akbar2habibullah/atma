<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 650" role="img" aria-labelledby="title desc">
  <title id="title">Long-context Pareto frontier at 256K</title>
  <desc id="desc">A bubble chart compares 256K target-token retrieval accuracy with 128K decode latency. Bubble area represents BABILong exact match.</desc>
  <defs>
    <style>.sans{font-family:Inter,Arial,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}.mono{font-family:'SFMono-Regular',Consolas,monospace}.muted{fill:#6e7480}.grid{stroke:#dde1e7;stroke-width:1}.axis{stroke:#111318;stroke-width:1.5}.small{font-size:11px}.label{font-size:13px}</style>
  </defs>
  <rect width="1050" height="650" fill="#f7f7f5"/>
  <text x="52" y="42" class="sans" font-size="11" font-weight="700" letter-spacing="1.8" fill="#5275ff">FIGURE 05 · MULTI-OBJECTIVE FRONTIER</text>
  <text x="52" y="79" class="serif" font-size="28" fill="#111318">Long-context quality is a trade-off, not a leaderboard</text>
  <text x="52" y="104" class="sans muted label">256K retrieval vs. 128K decode latency · bubble area = adapted BABILong at 256K</text>

  <g>
    <line x1="92" y1="146" x2="970" y2="146" class="grid"/><line x1="92" y1="246" x2="970" y2="246" class="grid"/><line x1="92" y1="346" x2="970" y2="346" class="grid"/><line x1="92" y1="446" x2="970" y2="446" class="grid"/><line x1="92" y1="546" x2="970" y2="546" class="grid"/>
    <line x1="92" y1="140" x2="92" y2="546" class="axis"/><line x1="92" y1="546" x2="970" y2="546" class="axis"/>
    <g class="mono muted small"><text x="61" y="550">0</text><text x="54" y="450">10</text><text x="54" y="350">20</text><text x="54" y="250">30</text><text x="54" y="150">40</text><text x="88" y="571">0</text><text x="326" y="571">5</text><text x="564" y="571">10</text><text x="802" y="571">15</text><text x="957" y="571">18</text></g>
    <text x="531" y="608" text-anchor="middle" class="sans muted label">decode latency at 128K · ms/token · lower is better ←</text>
    <text x="25" y="346" text-anchor="middle" class="sans muted label" transform="rotate(-90 25 346)">target-token retrieval at 256K · higher is better ↑</text>

    <path d="M202 343 C345 250 558 194 887 202" fill="none" stroke="#4f6672" stroke-width="2.5" stroke-dasharray="9 7"/>
    <text x="488" y="226" class="sans small" fill="#4f6672">empirical operating frontier</text>

    <circle cx="202" cy="343" r="34" fill="#7dc58a" fill-opacity=".72" stroke="#347342" stroke-width="2"/>
    <circle cx="203" cy="446" r="30" fill="#b7dfbd" fill-opacity=".85" stroke="#4f9458" stroke-width="2"/>
    <circle cx="887" cy="202" r="27" fill="#8eb1ff" fill-opacity=".85" stroke="#3458df" stroke-width="2"/>
    <circle cx="892" cy="540" r="8" fill="#fff" stroke="#111318" stroke-width="2"/>
    <circle cx="897" cy="546" r="18" fill="#f3c5ce" fill-opacity=".75" stroke="#a83e56" stroke-width="2"/>

    <text x="202" y="295" text-anchor="middle" class="sans label" font-weight="700" fill="#111318">Raven Native</text>
    <text x="202" y="316" text-anchor="middle" class="mono small" fill="#347342">3.27 ms · 20.3% · BABILong 46</text>
    <text x="203" y="493" text-anchor="middle" class="sans label" font-weight="700" fill="#111318">Atma-Raven-Titans</text>
    <text x="203" y="511" text-anchor="middle" class="mono small" fill="#347342">2.27 ms · 10.0% · BABILong 38</text>
    <text x="887" y="154" text-anchor="middle" class="sans label" font-weight="700" fill="#111318">Polar</text>
    <text x="887" y="174" text-anchor="middle" class="mono small" fill="#3458df">16.3 ms · 34.4% · BABILong 28</text>
    <text x="850" y="522" text-anchor="end" class="sans small" fill="#111318">NoPE · 0.6%</text>
    <text x="932" y="525" class="sans small" fill="#a83e56">RoPE · 0.0%</text>

    <g transform="translate(105 166)">
      <rect width="210" height="92" rx="6" fill="#fff" stroke="#cfd4dc"/>
      <text x="16" y="24" class="mono" font-size="9" font-weight="700" fill="#6e7480">BUBBLE AREA · BABILONG</text>
      <circle cx="32" cy="51" r="7" fill="none" stroke="#6e7480"/><text x="49" y="55" class="sans small" fill="#6e7480">≈ 0</text>
      <circle cx="92" cy="51" r="14" fill="none" stroke="#6e7480"/><text x="113" y="55" class="sans small" fill="#6e7480">≈ 25</text>
      <circle cx="167" cy="51" r="22" fill="none" stroke="#6e7480"/><text x="196" y="55" class="sans small" fill="#6e7480">46</text>
      <text x="16" y="80" class="sans" font-size="9" fill="#8a9099">Serving values: one sequence, one L40S.</text>
    </g>
  </g>
</svg>
