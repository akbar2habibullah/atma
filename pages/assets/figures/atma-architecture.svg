<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">ATMA architecture and Polar Attention block</title>
  <desc id="desc">A sixteen-layer ATMA stack feeds a Polar Attention block whose content, count, and gated-delta memory branches merge into the residual stream.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#4f5661"/></marker>
    <style>
      .sans{font-family:Inter,Arial,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}.mono{font-family:'SFMono-Regular',Consolas,monospace}
      .kicker{font-size:11px;font-weight:700;letter-spacing:1.8px;fill:#5275ff}.small{font-size:11px;fill:#626975}.label{font-size:13px;font-weight:650;fill:#16191f}.title{font-size:27px;font-weight:500;fill:#111318}.rule{stroke:#d6dae1;stroke-width:1}.flow{fill:none;stroke:#4f5661;stroke-width:1.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#f7f7f5"/>
  <text x="40" y="42" class="sans kicker">FIGURE 01 · ARCHITECTURE</text>
  <text x="40" y="78" class="serif title">One full-context read, three complementary channels</text>
  <line x1="40" y1="96" x2="1160" y2="96" class="rule"/>

  <rect x="40" y="124" width="230" height="552" rx="8" fill="#fff" stroke="#cfd4dc"/>
  <text x="64" y="158" class="sans kicker">ATMA STACK · 3:1</text>
  <text x="64" y="182" class="serif" font-size="20" fill="#111318">16 decoder layers</text>
  <g class="sans small">
    <rect x="64" y="202" width="11" height="11" fill="#dceede" stroke="#65a66d"/><text x="83" y="212">12 gated-convolution mixers</text>
    <rect x="64" y="222" width="11" height="11" fill="#dce8ff" stroke="#5275ff"/><text x="83" y="232">4 Polar + memory mixers</text>
  </g>
  <g stroke-width="1.2">
    <rect x="82" y="256" width="146" height="23" rx="4" fill="#dceede" stroke="#65a66d"/>
    <rect x="82" y="286" width="146" height="23" rx="4" fill="#dceede" stroke="#65a66d"/>
    <rect x="82" y="316" width="146" height="23" rx="4" fill="#dceede" stroke="#65a66d"/>
    <rect x="82" y="346" width="146" height="27" rx="4" fill="#dce8ff" stroke="#5275ff"/>
    <rect x="82" y="383" width="146" height="23" rx="4" fill="#dceede" stroke="#65a66d"/>
    <rect x="82" y="413" width="146" height="23" rx="4" fill="#dceede" stroke="#65a66d"/>
    <rect x="82" y="443" width="146" height="23" rx="4" fill="#dceede" stroke="#65a66d"/>
    <rect x="82" y="473" width="146" height="27" rx="4" fill="#dce8ff" stroke="#5275ff"/>
    <rect x="82" y="510" width="146" height="23" rx="4" fill="#dceede" stroke="#65a66d"/>
    <rect x="82" y="540" width="146" height="23" rx="4" fill="#dceede" stroke="#65a66d"/>
    <rect x="82" y="570" width="146" height="23" rx="4" fill="#dceede" stroke="#65a66d"/>
    <rect x="82" y="600" width="146" height="27" rx="4" fill="#dce8ff" stroke="#5275ff"/>
  </g>
  <text x="155" y="365" text-anchor="middle" class="mono" font-size="9" fill="#3458df">POLAR + MEMORY ×4</text>
  <text x="155" y="648" text-anchor="middle" class="sans small">+ final 3:1 group and LM head</text>

  <rect x="294" y="124" width="866" height="552" rx="8" fill="#fff" stroke="#cfd4dc"/>
  <text x="322" y="158" class="sans kicker">POLAR ATTENTION BLOCK</text>
  <text x="322" y="182" class="serif" font-size="20" fill="#111318">content + count + compressed memory</text>

  <circle cx="727" cy="231" r="20" fill="#111318"/><text x="727" y="238" text-anchor="middle" class="serif" font-size="23" fill="#fff">+</text>
  <path d="M727 211V195" class="flow"/><text x="727" y="184" text-anchor="middle" class="sans small">to residual stream</text>

  <g>
    <rect x="338" y="270" width="236" height="52" rx="6" fill="#e5edff" stroke="#5275ff"/>
    <text x="356" y="289" class="mono" font-size="9" font-weight="700" fill="#3458df">01 · CONTENT</text>
    <text x="356" y="309" class="sans label">What matched?</text>
    <rect x="338" y="344" width="236" height="42" rx="5" fill="#f7f9ff" stroke="#9db2ff"/>
    <text x="456" y="370" text-anchor="middle" class="sans small">scores → temperature → null sink</text>
    <rect x="338" y="399" width="236" height="42" rx="5" fill="#f7f9ff" stroke="#9db2ff"/>
    <text x="456" y="425" text-anchor="middle" class="sans small">renormalize over real keys</text>
    <rect x="338" y="454" width="236" height="42" rx="5" fill="#f7f9ff" stroke="#9db2ff"/>
    <text x="456" y="480" text-anchor="middle" class="sans small">normalize weighted-value direction</text>
    <rect x="338" y="509" width="236" height="42" rx="5" fill="#dce8ff" stroke="#5275ff"/>
    <text x="456" y="535" text-anchor="middle" class="sans label">content projection W<tspan baseline-shift="sub" font-size="9">o</tspan></text>
    <path d="M456 509V496M456 454V441M456 399V386M456 344V322M456 270V251H707" class="flow"/>
  </g>

  <g>
    <rect x="609" y="270" width="236" height="52" rx="6" fill="#e3f1e4" stroke="#65a66d"/>
    <text x="627" y="289" class="mono" font-size="9" font-weight="700" fill="#347342">02 · COUNT</text>
    <text x="627" y="309" class="sans label">How much matched?</text>
    <rect x="609" y="344" width="236" height="42" rx="5" fill="#f7fbf7" stroke="#93bf98"/>
    <text x="727" y="370" text-anchor="middle" class="sans small">participation ratio 1 / Σŵ²</text>
    <rect x="609" y="399" width="236" height="42" rx="5" fill="#f7fbf7" stroke="#93bf98"/>
    <text x="727" y="425" text-anchor="middle" class="sans small">remove null-sink participation</text>
    <rect x="609" y="454" width="236" height="42" rx="5" fill="#f7fbf7" stroke="#93bf98"/>
    <text x="727" y="480" text-anchor="middle" class="sans small">bounded tanh(β log(1 + m<tspan baseline-shift="sub" font-size="8">eff</tspan>))</text>
    <rect x="609" y="509" width="236" height="42" rx="5" fill="#e3f1e4" stroke="#65a66d"/>
    <text x="727" y="535" text-anchor="middle" class="sans label">count projection W<tspan baseline-shift="sub" font-size="9">μ</tspan></text>
    <path d="M727 509V496M727 454V441M727 399V386M727 344V322M727 270V251" class="flow"/>
  </g>

  <g>
    <rect x="880" y="270" width="236" height="52" rx="6" fill="#f0e5f6" stroke="#9c56bd"/>
    <text x="898" y="289" class="mono" font-size="9" font-weight="700" fill="#80429e">03 · MEMORY</text>
    <text x="898" y="309" class="sans label">What should persist?</text>
    <rect x="880" y="344" width="236" height="42" rx="5" fill="#fcf8fd" stroke="#bd89d1"/>
    <text x="998" y="370" text-anchor="middle" class="sans small">gated-delta recurrent update</text>
    <rect x="880" y="399" width="236" height="42" rx="5" fill="#fcf8fd" stroke="#bd89d1"/>
    <text x="998" y="425" text-anchor="middle" class="sans small">read with L2-normalized keys</text>
    <rect x="880" y="454" width="236" height="42" rx="5" fill="#fcf8fd" stroke="#bd89d1"/>
    <text x="998" y="480" text-anchor="middle" class="sans small">RMS norm + learned gate</text>
    <rect x="880" y="509" width="236" height="42" rx="5" fill="#f0e5f6" stroke="#9c56bd"/>
    <text x="998" y="535" text-anchor="middle" class="sans label">zero-init memory projection</text>
    <path d="M998 509V496M998 454V441M998 399V386M998 344V322M998 270V251H747" class="flow"/>
  </g>

  <rect x="449" y="601" width="556" height="43" rx="6" fill="#fff7ee" stroke="#dc8841"/>
  <text x="727" y="628" text-anchor="middle" class="sans label">shared q, k, v and gates · causal convolution · RMSNorm</text>
  <path d="M615 601L456 551M727 601V551M839 601L998 551" class="flow"/>
</svg>
