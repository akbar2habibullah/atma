  <path d="M938 449H981" class="flow"/><rect x="982" y="398" width="92" height="102" rx="7" fill="#fff7eb" stroke="#d99a47"/><text x="1028" y="420" text-anchor="middle" class="mono micro" fill="#a76818">OUTPUT</text><text x="1028" y="444" text-anchor="middle" class="sans label">gate σ(g)</text><line x1="999" y1="457" x2="1057" y2="457" class="rule"/><text x="1028" y="477" text-anchor="middle" class="sans label">Wₒ project</text><path d="M1074 449H1099" class="flow"/><circle cx="1123" cy="449" r="22" fill="#fff" stroke="#111318" stroke-width="1.5"/><text x="1123" y="457" text-anchor="middle" class="serif" font-size="25" fill="#111318">+</text><path d="M1145 449H1178" class="flow"/><text x="1188" y="456" class="serif" font-size="19" fill="#111318">y</text>
