<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 680" role="img" aria-labelledby="title desc">
  <title id="title">ATMA layer schedule and Polar Attention global block</title>
  <desc id="desc">The sixteen-layer schedule repeats local, local, global, local four times. The expanded global block routes normalized inputs through content direction, bounded participation count, and gated-delta memory paths before gated projection and residual addition.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0l7 3.5L0 7z" fill="#505762"/></marker>
    <style>.sans{font-family:Inter,Arial,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}.mono{font-family:'SFMono-Regular',Consolas,monospace}.kicker{font-size:11px;font-weight:700;letter-spacing:1.8px;fill:#5275ff}.title{font-size:28px;font-weight:500;fill:#111318}.section{font-size:15px;font-weight:700;fill:#111318}.label{font-size:12px;font-weight:650;fill:#20242b}.small{font-size:10px;fill:#68707c}.micro{font-size:8px;font-weight:700;letter-spacing:1px}.rule{stroke:#d5dae2;stroke-width:1}.branch,.flow,.residual{fill:none;stroke-linecap:round;stroke-linejoin:round}.branch{stroke:#505762;stroke-width:1.5}.flow{stroke:#505762;stroke-width:1.6;marker-end:url(#arrow)}.residual{stroke:#8c939d;stroke-width:1.25;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1260" height="680" fill="#f7f7f5"/>
  <text x="42" y="40" class="sans kicker">FIGURE 01 · MODEL ARCHITECTURE</text>
  <text x="42" y="76" class="serif title">Local mixing between full-context reads</text>
  <text x="1218" y="72" text-anchor="end" class="sans small">16 decoder layers · 12 local + 4 global</text>
  <line x1="42" y1="95" x2="1218" y2="95" class="rule"/>

  <text x="42" y="126" class="sans section">Layer schedule</text>
  <text x="1218" y="124" text-anchor="end" class="mono small">repeat ×4 · LOCAL → LOCAL → GLOBAL → LOCAL</text>
  <g class="sans">
    <g transform="translate(42 145)"><rect width="264" height="70" rx="8" fill="#fff" stroke="#cfd4dc"/><text x="12" y="17" class="mono micro" fill="#8a9099">GROUP 1</text><g transform="translate(12 27)"><rect width="52" height="29" rx="4" fill="#e4f1e5" stroke="#72aa78"/><text x="26" y="19" text-anchor="middle" class="mono" font-size="9" fill="#347342">L1</text><rect x="61" width="52" height="29" rx="4" fill="#e4f1e5" stroke="#72aa78"/><text x="87" y="19" text-anchor="middle" class="mono" font-size="9" fill="#347342">L2</text><rect x="122" width="52" height="29" rx="4" fill="#e5edff" stroke="#5275ff"/><text x="148" y="19" text-anchor="middle" class="mono" font-size="9" font-weight="700" fill="#3458df">G3</text><rect x="183" width="52" height="29" rx="4" fill="#e4f1e5" stroke="#72aa78"/><text x="209" y="19" text-anchor="middle" class="mono" font-size="9" fill="#347342">L4</text></g></g>
    <g transform="translate(346 145)"><rect width="264" height="70" rx="8" fill="#fff" stroke="#cfd4dc"/><text x="12" y="17" class="mono micro" fill="#8a9099">GROUP 2</text><g transform="translate(12 27)"><rect width="52" height="29" rx="4" fill="#e4f1e5" stroke="#72aa78"/><text x="26" y="19" text-anchor="middle" class="mono" font-size="9" fill="#347342">L5</text><rect x="61" width="52" height="29" rx="4" fill="#e4f1e5" stroke="#72aa78"/><text x="87" y="19" text-anchor="middle" class="mono" font-size="9" fill="#347342">L6</text><rect x="122" width="52" height="29" rx="4" fill="#e5edff" stroke="#5275ff"/><text x="148" y="19" text-anchor="middle" class="mono" font-size="9" font-weight="700" fill="#3458df">G7</text><rect x="183" width="52" height="29" rx="4" fill="#e4f1e5" stroke="#72aa78"/><text x="209" y="19" text-anchor="middle" class="mono" font-size="9" fill="#347342">L8</text></g></g>
    <g transform="translate(650 145)"><rect width="264" height="70" rx="8" fill="#fff" stroke="#cfd4dc"/><text x="12" y="17" class="mono micro" fill="#8a9099">GROUP 3</text><g transform="translate(12 27)"><rect width="52" height="29" rx="4" fill="#e4f1e5" stroke="#72aa78"/><text x="26" y="19" text-anchor="middle" class="mono" font-size="9" fill="#347342">L9</text><rect x="61" width="52" height="29" rx="4" fill="#e4f1e5" stroke="#72aa78"/><text x="87" y="19" text-anchor="middle" class="mono" font-size="9" fill="#347342">L10</text><rect x="122" width="52" height="29" rx="4" fill="#e5edff" stroke="#5275ff"/><text x="148" y="19" text-anchor="middle" class="mono" font-size="9" font-weight="700" fill="#3458df">G11</text><rect x="183" width="52" height="29" rx="4" fill="#e4f1e5" stroke="#72aa78"/><text x="209" y="19" text-anchor="middle" class="mono" font-size="9" fill="#347342">L12</text></g></g>
    <g transform="translate(954 145)"><rect width="264" height="70" rx="8" fill="#fff" stroke="#cfd4dc"/><text x="12" y="17" class="mono micro" fill="#8a9099">GROUP 4</text><g transform="translate(12 27)"><rect width="52" height="29" rx="4" fill="#e4f1e5" stroke="#72aa78"/><text x="26" y="19" text-anchor="middle" class="mono" font-size="9" fill="#347342">L13</text><rect x="61" width="52" height="29" rx="4" fill="#e4f1e5" stroke="#72aa78"/><text x="87" y="19" text-anchor="middle" class="mono" font-size="9" fill="#347342">L14</text><rect x="122" width="52" height="29" rx="4" fill="#e5edff" stroke="#5275ff"/><text x="148" y="19" text-anchor="middle" class="mono" font-size="9" font-weight="700" fill="#3458df">G15</text><rect x="183" width="52" height="29" rx="4" fill="#e4f1e5" stroke="#72aa78"/><text x="209" y="19" text-anchor="middle" class="mono" font-size="9" fill="#347342">L16</text></g></g>
    <path d="M306 180H342" class="flow"/>
    <path d="M610 180H646" class="flow"/>
    <path d="M914 180H950" class="flow"/>
  </g>

  <rect x="42" y="245" width="1176" height="388" rx="10" fill="#fff" stroke="#cfd4dc"/>
  <text x="64" y="275" class="sans section">Expanded global block</text><text x="1196" y="274" text-anchor="end" class="sans small">Polar Attention + gated-delta memory</text>
  <rect x="65" y="380" width="58" height="50" rx="7" fill="#fff" stroke="#cfd4dc"/><text x="94" y="401" text-anchor="middle" class="serif" font-size="19" fill="#111318">x</text><text x="94" y="418" text-anchor="middle" class="mono" font-size="8" fill="#7b828d">HIDDEN</text><path d="M123 405H150" class="flow"/>
  <rect x="151" y="356" width="126" height="98" rx="7" fill="#fff7eb" stroke="#d99a47"/><text x="214" y="378" text-anchor="middle" class="mono micro" fill="#a76818">PRE-NORM</text><text x="214" y="399" text-anchor="middle" class="sans label">RMSNorm</text><line x1="170" y1="409" x2="258" y2="409" class="rule"/><text x="214" y="427" text-anchor="middle" class="sans small">q, k, v + gates</text><text x="214" y="441" text-anchor="middle" class="sans small">causal conv</text>
  <rect x="314" y="306" width="673" height="263" rx="12" fill="#f8faff" stroke="#7391e8" stroke-width="1.5" stroke-dasharray="7 5"/><text x="335" y="332" class="sans" font-size="13" font-weight="700" fill="#3458df">Polar Attention sublayer</text>
  <path d="M277 390H337" class="flow"/><rect x="338" y="354" width="135" height="72" rx="7" fill="#e5edff" stroke="#6e8ee7"/><text x="353" y="374" class="mono micro" fill="#3458df">SCORE</text><text x="353" y="394" class="sans label">qkᵀ / √d</text><text x="353" y="412" class="sans small">length temperature</text><path d="M473 390H496" class="flow"/>
  <rect x="497" y="354" width="147" height="72" rx="7" fill="#e5edff" stroke="#6e8ee7"/><text x="512" y="374" class="mono micro" fill="#3458df">CALIBRATE</text><text x="512" y="394" class="sans label">adaptive null sink</text><text x="512" y="412" class="sans small">softmax + real-key weights</text>
  <path d="M644 378H707" class="flow"/><rect x="708" y="345" width="146" height="66" rx="7" fill="#e5edff" stroke="#5275ff"/><text x="723" y="366" class="mono micro" fill="#3458df">CONTENT</text><text x="723" y="386" class="sans label">direction cᵢ</text><text x="723" y="402" class="sans small">normalize Σwⱼvⱼ</text>
  <path d="M644 402H676Q684 402 684 410V465Q684 473 707 473" class="flow"/><rect x="708" y="440" width="146" height="66" rx="7" fill="#e5f2e6" stroke="#65a66d"/><text x="723" y="461" class="mono micro" fill="#347342">COUNT</text><text x="723" y="481" class="sans label">magnitude μᵢ</text><text x="723" y="497" class="sans small">bounded participation</text>
  <path d="M277 429H298Q304 429 304 435V513Q304 519 310 519H496" class="flow"/><rect x="497" y="486" width="147" height="66" rx="7" fill="#f2e8f7" stroke="#a968c4"/><text x="512" y="507" class="mono micro" fill="#80429e">MEMORY</text><text x="512" y="527" class="sans label">gated-delta state</text><text x="512" y="543" class="sans small">normalized recurrent read</text>
